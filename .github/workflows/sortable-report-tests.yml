name: Sortable report tests
on:
  pull_request:
    paths:
      - 'sortable_report.py'
      - 'sortable_report.html'
      - 'sort_rows.js'
      - 'tests/test_sortable_report.py'
      - 'tests/test_sort_rows.js'
      - '.github/workflows/sortable-report-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m unittest discover -s tests -p 'test_sortable_report.py' -v
      - run: node tests/test_sort_rows.js
