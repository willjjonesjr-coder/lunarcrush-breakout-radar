name: Provisional identity and EMA research
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: provisional-ema-research
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Match identities, corroborate markets and validate histories
        run: python provisional_ema.py
      - name: Build view with separate provisional columns
        run: python sortable_report.py --output reports/provisional_ema/radar_sortable.html
      - uses: actions/upload-artifact@v4
        with:
          name: provisional-ema-research
          path: reports/provisional_ema/
          retention-days: 30
