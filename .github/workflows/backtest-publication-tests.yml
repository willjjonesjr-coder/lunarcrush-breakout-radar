name: Backtest publication tests
on:
  pull_request:
    paths:
      - 'backtest.py'
      - 'backtest_features.py'
      - 'tools/benchmark_backtest.py'
      - 'tests/test_backtest_features.py'
      - 'tests/test_backtest_runtime.py'
      - 'tests/backtest_reference.py'
      - 'signals.py'
      - 'requirements.txt'
      - '.gitignore'
      - 'tools/check_backtest_publication.py'
      - 'tests/test_backtest_publication.py'
      - '.github/workflows/backtest.yml'
      - '.github/workflows/backtest-publication-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p 'test_backtest*.py' -v
