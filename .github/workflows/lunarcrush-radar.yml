name: LunarCrush Breakout Radar

on:
  workflow_dispatch:
    inputs:
      top:
        description: "Number of finalists"
        required: false
        default: "15"
  schedule:
    - cron: "0 21 * * *"
      timezone: "America/New_York"
permissions:
  contents: write

concurrency:
  group: lunarcrush-breakout-radar
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check production start date
        id: start_date
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "schedule" && "$(TZ=America/New_York date +%F)" == "2026-10-20" ]]; then
            echo "run_scan=false" >> "$GITHUB_OUTPUT"
            echo "Skipping October 20 scheduled scan; resume October 21 at 9 PM Eastern."
          else
            echo "run_scan=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out repository
        if: steps.start_date.outputs.run_scan == 'true'
        uses: actions/checkout@v4

      - name: Set up Python
        if: steps.start_date.outputs.run_scan == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        if: steps.start_date.outputs.run_scan == 'true'
        run: pip install -r requirements.txt

      - name: Run breakout scanner
        if: steps.start_date.outputs.run_scan == 'true'
        env:
          LUNARCRUSH_API_KEY: ${{ secrets.LUNARCRUSH_API_KEY }}
          RADAR_TOP: ${{ inputs.top || '15' }}
        run: python scanner.py --top "$RADAR_TOP"

      - name: Add observational fundamentals
        if: steps.start_date.outputs.run_scan == 'true'
        continue-on-error: true
        timeout-minutes: 10
        env:
          COINGECKO_DEMO_API_KEY: ${{ secrets.COINGECKO_DEMO_API_KEY }}
        run: python fundamentals.py

      - name: Refresh market regime context
        if: steps.start_date.outputs.run_scan == 'true'
        timeout-minutes: 8
        run: python production_regime.py

      - name: Build sortable results view
        if: steps.start_date.outputs.run_scan == 'true'
        run: python sortable_report.py

      - name: Archive today's radar
        if: steps.start_date.outputs.run_scan == 'true'
        shell: bash
        run: |
          mkdir -p reports/archive
          DAY=$(date -u +%Y-%m-%d)
          cp reports/breakout_radar.csv "reports/archive/breakout_radar_${DAY}.csv"
          cp reports/breakout_radar.json "reports/archive/breakout_radar_${DAY}.json"
          for REPORT in radar_candidates.csv radar_candidates.json separated_assets.csv separated_assets.json radar_coverage.json daily_spike_history.csv daily_spike_history.json radar_sortable.html market_regime.csv market_regime_latest.json market_regime_inventory.csv; do
            cp "reports/$REPORT" "reports/archive/${DAY}_${REPORT}"
          done

      - name: Publish data coverage summary
        if: steps.start_date.outputs.run_scan == 'true'
        run: |
          python - <<'PYTHON'
          import json, os
          from pathlib import Path
          summary = json.loads(Path("reports/radar_coverage.json").read_text())
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as report:
              report.write("## Radar data coverage\n\n")
              report.write(f"Scored {summary['scored_candidates']} of {summary['history_candidates']} historical candidates; "
                           f"{summary['finalists']} finalists; {summary['separated_assets']} assets separated by type.\n\n")
              report.write("```json\n" + json.dumps(summary, indent=2) + "\n```\n")
          PYTHON
          python - <<'PYTHON'
          import json, os
          from pathlib import Path
          regime = json.loads(Path("reports/market_regime_latest.json").read_text())
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as report:
              report.write("\n## Crypto market regime\n\n")
              report.write(f"{regime['classification']} | Score: {regime['score']} / 100 | "
                           f"Coverage: {regime['available_assets']}/{regime['expected_assets']} | "
                           f"As of: {regime['as_of'] or 'unavailable'}\n")
          PYTHON

      - name: Commit updated data and reports
        if: steps.start_date.outputs.run_scan == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data reports
          if git diff --cached --quiet; then
            echo "No report changes to commit."
          else
            git commit -m "Update LunarCrush breakout radar"
            git pull --rebase origin "${GITHUB_REF_NAME:-main}"
            git push origin "HEAD:${GITHUB_REF_NAME:-main}"
          fi

      - name: Upload report artifact
        if: steps.start_date.outputs.run_scan == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: lunarcrush-breakout-radar
          path: |
            reports/breakout_radar.csv
            reports/breakout_radar.json
            reports/radar_candidates.csv
            reports/radar_candidates.json
            reports/separated_assets.csv
            reports/separated_assets.json
            reports/radar_coverage.json
            reports/daily_spike_history.csv
            reports/daily_spike_history.json
            reports/radar_sortable.html
            reports/market_regime.csv
            reports/market_regime_latest.json
            reports/market_regime_inventory.csv
          retention-days: 30
