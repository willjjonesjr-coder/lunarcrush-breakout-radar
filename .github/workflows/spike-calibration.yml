name: Daily Spike Calibration Experiment
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  calibrate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Compare production and alternative spike weights
        run: python spike_calibration.py
      - uses: actions/upload-artifact@v4
        with:
          name: spike-calibration-results
          path: |
            reports/spike_calibration_events.csv
            reports/spike_calibration_summary.csv
            reports/spike_calibration_manifest.json
          retention-days: 30
