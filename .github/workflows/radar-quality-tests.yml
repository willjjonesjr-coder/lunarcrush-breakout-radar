name: Radar quality tests
on:
  pull_request:
    paths:
      - 'scanner.py'
      - 'radar_quality.py'
      - 'tests/test_radar_quality.py'
      - '.github/workflows/lunarcrush-radar.yml'
      - '.github/workflows/radar-quality-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p 'test_radar_quality.py' -v
