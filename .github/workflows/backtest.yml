name: Anti-pump Backtest Analysis

on:
  workflow_dispatch:
    inputs:
      thresholds:
        description: "Signal score thresholds (comma-separated)"
        required: false
        default: "20,25,30,35,40"
      horizons:
        description: "Forward-return horizons in days (comma-separated)"
        required: false
        default: "7,14,30"
      strategy:
        description: "Strategy to test"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - baseline
          - moderate
          - strict
  schedule:
    - cron: "30 9 * * 0"
      timezone: "America/New_York"

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run anti-pump backtest
        run: |
          python backtest.py \
            --data-dir data \
            --output reports/backtest.csv \
            --thresholds "${{ inputs.thresholds || '20,25,30,35,40' }}" \
            --horizons "${{ inputs.horizons || '7,14,30' }}" \
            --strategy "${{ inputs.strategy || 'all' }}"

      - name: Upload backtest results
        uses: actions/upload-artifact@v4
        with:
          name: anti-pump-backtest-results
          path: |
            reports/backtest*.csv
          retention-days: 30

      - name: Commit backtest results (if changed)
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/backtest*.csv
          if git diff --cached --quiet; then
            echo "No backtest changes to commit."
          else
            git commit -m "Update anti-pump backtest results"
            git pull --rebase origin "${GITHUB_REF_NAME:-main}"
            git push origin "HEAD:${GITHUB_REF_NAME:-main}"
          fi
