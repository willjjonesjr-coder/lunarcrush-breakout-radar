name: Review staged EMA identities for evidence
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: priority-ema-80-staging
          path: artifact-stage
          run-id: 41196139681
          repository: willjjonesjr-coder/lunarcrush-breakout-radar
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: ema-80-identity-review
          path: artifact-identity
          run-id: 41230796034
          repository: willjjonesjr-coder/lunarcrush-breakout-radar
          github-token: ${{ github.token }}
      - run: python tools/ema_staged_identity_review.py
      - uses: actions/upload-artifact@v4
        with:
          name: ema-staged-identity-review
          path: |
            reports/ema_staged_identity_review.csv
            reports/ema_staged_identity_review.json
          retention-days: 30
