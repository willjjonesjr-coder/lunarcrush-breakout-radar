name: Historical Signals Smoke Test
on:
  push:
    branches: [feat/historical-signals]
    paths:
      - 'tools/ccxt_backfill.py'
      - 'tools/historical_exchange_diversity.py'
      - 'tools/audit_expanded_cex_coverage.py'
      - 'tools/ema_eligibility_diagnostics.py'
      - '.github/workflows/historical-smoke.yml'
  pull_request:
    paths:
      - 'tools/historical_exchange_diversity.py'
      - 'tools/audit_expanded_cex_coverage.py'
      - 'tests/test_historical_exchange_diversity.py'
      - 'tests/test_expanded_cex_coverage.py'
      - '.github/workflows/historical-smoke.yml'
  workflow_dispatch:
    inputs:
      top:
        description: 'Coin cohort size (20 smoke; 80, 200, or 300 expanded)'
        required: true
        default: '20'
permissions:
  contents: read
jobs:
  diversity-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas
      - name: Test same-cohort research safeguards and exchange scorecard
        run: python -m unittest tests.test_historical_exchange_diversity tests.test_expanded_cex_coverage tests.test_compare_cex_coverage -v
  historical-smoke:
    if: github.event_name != 'pull_request'
    needs: diversity-tests
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy ccxt
      - name: Diagnose existing EMA eligibility
        run: python tools/ema_eligibility_diagnostics.py
      - name: Backfill historical OHLCV
        env:
          TOP: ${{ github.event.inputs.top || '20' }}
        run: python tools/ccxt_backfill.py --top "$TOP" --bars 500
      - name: Prepare exact historical cohort for nine-venue research
        env:
          TOP: ${{ github.event.inputs.top || '20' }}
        run: python tools/historical_exchange_diversity.py prepare --top "$TOP"
      - name: Discover all nine exchange sources (provisional, research only)
        env:
          TOP: ${{ github.event.inputs.top || '20' }}
        run: |
          python tools/audit_expanded_cex_coverage.py \
            --queue reports/historical_research_queue.json \
            --count "$TOP" --bars 500 --max-pairs-per-exchange 2 \
            --output reports/expanded_cex_coverage
      - name: Compare original three against additional six CEXs
        run: python tools/compare_cex_coverage.py
      - name: Publish per-exchange diversity and legacy-source concentration
        run: python tools/historical_exchange_diversity.py report
      - name: Upload reports and prices
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: historical-smoke-results
          path: |
            reports/ema_eligibility_diagnostics.csv.gz
            reports/backfill_inventory.csv
            data_price/
            logs/backfill.log
            reports/historical_research_queue.json
            reports/expanded_cex_coverage.csv
            reports/expanded_cex_coverage.json
            reports/expanded_cex_before_after.csv
            reports/expanded_cex_before_after.json
            reports/historical_exchange_diversity.csv
            reports/historical_exchange_diversity.json
          if-no-files-found: warn
